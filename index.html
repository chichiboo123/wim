<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's In My</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-gov.css" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body data-theme="blue">

  <!-- Header -->
  <header id="app-header">
    <button class="header-left icon-btn" id="header-back" style="display:none;" onclick="navigateTo('home')" aria-label="홈으로 이동">
      <span class="material-icons">arrow_back</span>
    </button>
    <div class="header-title" id="header-title" data-i18n="appTitle">What's In My</div>
    <div class="header-right">
      <div class="header-selects">
        <select id="theme-select" class="header-select" onchange="setTheme(this.value)" aria-label="테마 선택">
          <option value="blue">Blue</option>
          <option value="green">Green</option>
          <option value="pink">Pink</option>
          <option value="yellow">Yellow</option>
        </select>
        <select id="lang-select" class="header-select" onchange="setLang(this.value)" aria-label="언어 선택">
          <option value="ko">KO</option>
          <option value="en">EN</option>
          <option value="ja">JP</option>
        </select>
      </div>
      <button class="icon-btn" onclick="openBackupMenu()" title="백업/복원">
        <span class="material-icons">sync_alt</span>
      </button>
      <button class="icon-btn" id="reset-module-btn" onclick="resetCurrentModule()" title="현재 탭 초기화" style="display:none;">
        <span class="material-icons">restart_alt</span>
      </button>
      <button class="icon-btn" onclick="resetAllData()" title="전체 초기화">
        <span class="material-icons">delete_sweep</span>
      </button>
      <button class="icon-btn" onclick="showHelp()" title="도움말">
        <span class="material-icons">help_outline</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app-content">
    <!-- Pages are rendered here by router -->
  </main>

  <!-- FAB (Floating Action Button) - shown on module pages -->
  <div id="fab-container" style="display:none;">
    <div class="fab-menu" id="fab-menu">
      <button class="fab-item" onclick="exportJPG()" title="JPG">
        <span class="material-icons">image</span>
        <span>JPG</span>
      </button>
      <button class="fab-item" onclick="exportPDF()" title="PDF">
        <span class="material-icons">picture_as_pdf</span>
        <span>PDF</span>
      </button>
      <button class="fab-item" onclick="exportClipboard()" title="Clipboard">
        <span class="material-icons">content_copy</span>
        <span data-i18n="clipboard">복사</span>
      </button>
      <button class="fab-item" onclick="exportJSON()" title="JSON">
        <span class="material-icons">data_object</span>
        <span>JSON</span>
      </button>
    </div>
    <button class="fab-main" id="fab-toggle" onclick="toggleFab()">
      <span class="material-icons">ios_share</span>
    </button>
  </div>

  <!-- Footer -->
  <footer id="app-footer">
    <a href="https://litt.ly/chichiboo" target="_blank" rel="noopener">
      Created by. 교육뮤지컬 꿈꾸는 치수쌤
    </a>
  </footer>

  <!-- Help Modal -->
  <div id="help-modal" class="modal-overlay" style="display:none;" onclick="closeHelpOutside(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="helpTitle">사용법 안내</h2>
        <button class="icon-btn" onclick="closeHelp()"><span class="material-icons">close</span></button>
      </div>
      <div class="modal-body" id="help-body"></div>
    </div>
  </div>

  <!-- Hidden file input for data restore -->
  <input type="file" id="restore-file-input" accept=".json" style="display:none;" onchange="handleRestore(event)">

  <!-- Backup Menu Modal -->
  <div id="backup-modal" class="modal-overlay" style="display:none;" onclick="closeBackupOutside(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="backupTitle">백업 / 복원</h2>
        <button class="icon-btn" onclick="closeBackupMenu()"><span class="material-icons">close</span></button>
      </div>
      <div class="modal-body backup-actions">
        <button class="btn btn-primary" onclick="triggerBackupDownload()" data-i18n="backupDownload">백업 다운로드 (JSON)</button>
        <button class="btn btn-secondary" onclick="restoreData()" data-i18n="backupUpload">백업 업로드 (JSON)</button>
      </div>
    </div>
  </div>

  <!-- App Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script src="js/modules/bag.js"></script>
  <script src="js/modules/time.js"></script>
  <script src="js/modules/brain.js"></script>
  <script src="js/modules/mind.js"></script>
  <script src="js/modules/color.js"></script>
  <script src="js/modules/music.js"></script>
  <script src="js/modules/word.js"></script>
  <script src="js/modules/relationship.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
