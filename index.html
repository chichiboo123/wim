<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's In My</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23A8D8EA'/%3E%3Cpath fill='%23fff' d='M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z'/%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-gov.css" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body data-theme="blue">

  <!-- Header -->
  <header id="app-header">
    <!-- Brand area: clicking always goes home; back arrow appears on sub-pages -->
    <div class="header-brand" onclick="navigateTo('home')" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter'||event.key===' ')navigateTo('home')" aria-label="홈으로 이동">
      <span class="material-icons header-back-arrow" id="header-back" style="display:none;">arrow_back_ios_new</span>
      <span class="header-title" id="header-title" data-i18n="appTitle">What's In My</span>
    </div>
    <div class="header-right">
      <div class="header-selects">
        <div class="theme-picker-wrap">
          <button class="icon-btn" id="theme-toggle-btn" onclick="toggleThemeMenu()" title="테마 선택">
            <span class="theme-dot" id="theme-dot"></span>
          </button>
          <div class="theme-menu" id="theme-menu">
            <button class="theme-color-btn chip-blue" onclick="setThemeFromMenu('blue')" aria-label="Blue"></button>
            <button class="theme-color-btn chip-green" onclick="setThemeFromMenu('green')" aria-label="Green"></button>
            <button class="theme-color-btn chip-pink" onclick="setThemeFromMenu('pink')" aria-label="Pink"></button>
            <button class="theme-color-btn chip-yellow" onclick="setThemeFromMenu('yellow')" aria-label="Yellow"></button>
          </div>
        </div>
        <select id="lang-select" class="header-select" onchange="setLang(this.value)" aria-label="언어 선택">
          <option value="ko">KO</option>
          <option value="en">EN</option>
          <option value="ja">JP</option>
        </select>
      </div>
      <div class="backup-picker-wrap">
        <button class="icon-btn" onclick="toggleBackupMenu(event)" title="백업/복원">
          <span class="material-icons">save</span>
        </button>
        <div class="backup-menu-dropdown" id="backup-menu-dropdown">
          <button class="dropdown-item" onclick="triggerBackupDownload()" data-i18n="backupDownload">백업 다운로드 (JSON)</button>
          <button class="dropdown-item" onclick="restoreData()" data-i18n="backupUpload">백업 업로드 (JSON)</button>
        </div>
      </div>
      <button class="icon-btn" id="reset-module-btn" onclick="resetCurrentModule()" title="현재 탭 초기화" style="display:none;">
        <span class="material-icons">restart_alt</span>
      </button>
      <button class="icon-btn" id="reset-all-btn" onclick="resetAllData()" title="전체 초기화">
        <span class="material-icons">delete_sweep</span>
      </button>
      <button class="icon-btn" onclick="showReport()" title="보고서">
        <span class="material-icons">description</span>
      </button>
      <button class="icon-btn" onclick="showHelp()" title="도움말">
        <span class="material-icons">help_outline</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app-content">
    <!-- Pages are rendered here by router -->
  </main>

  <!-- FAB (Floating Action Button) - shown on module pages -->
  <div id="fab-container" style="display:none;">
    <div class="fab-menu" id="fab-menu">
      <button class="fab-item" onclick="exportJPG()" title="JPG">
        <span class="material-icons">image</span>
        <span>JPG</span>
      </button>
      <button class="fab-item" onclick="exportPDF()" title="PDF">
        <span class="material-icons">picture_as_pdf</span>
        <span>PDF</span>
      </button>
      <button class="fab-item" onclick="exportClipboard()" title="Clipboard">
        <span class="material-icons">content_copy</span>
        <span data-i18n="clipboard">복사</span>
      </button>
      <button class="fab-item" onclick="exportJSON()" title="JSON">
        <span class="material-icons">data_object</span>
        <span>JSON</span>
      </button>
    </div>
    <button class="fab-main" id="fab-toggle" onclick="toggleFab()">
      <span class="material-icons">ios_share</span>
    </button>
  </div>

  <!-- Footer -->
  <footer id="app-footer">
    <a href="https://litt.ly/chichiboo" target="_blank" rel="noopener">
      Created by. 교육뮤지컬 꿈꾸는 치수쌤
    </a>
  </footer>

  <!-- Help Modal -->
  <div id="help-modal" class="modal-overlay" style="display:none;" onclick="closeHelpOutside(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="helpTitle">사용법 안내</h2>
        <button class="icon-btn" onclick="closeHelp()"><span class="material-icons">close</span></button>
      </div>
      <div class="modal-body" id="help-body"></div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="report-modal" class="modal-overlay" style="display:none;" onclick="closeReportOutside(event)">
    <div class="modal-content report-modal-content">
      <div class="modal-header report-modal-header">
        <div class="report-modal-header-left">
          <span class="material-icons" style="color:var(--primary);font-size:20px;">description</span>
          <span class="report-modal-title" data-i18n="reportExportTitle">보고서 내보내기</span>
        </div>
        <button class="icon-btn" onclick="closeReport()" aria-label="닫기"><span class="material-icons">close</span></button>
      </div>
      <div class="report-actions">
        <div class="report-actions-group">
          <span class="report-actions-label">이미지</span>
          <button class="btn btn-primary btn-sm" onclick="reportDownloadJpg()">
            <span class="material-icons" style="font-size:15px;vertical-align:-3px;">download</span>
            <span data-i18n="reportDownloadJpg">JPG 다운로드</span>
          </button>
          <button class="btn btn-secondary btn-sm" onclick="reportCopyJpg()">
            <span class="material-icons" style="font-size:15px;vertical-align:-3px;">content_copy</span>
            <span data-i18n="reportCopyJpg">JPG 복사</span>
          </button>
        </div>
        <div class="report-actions-group">
          <span class="report-actions-label">텍스트</span>
          <button class="btn btn-secondary btn-sm" onclick="reportCopyText()">
            <span class="material-icons" style="font-size:15px;vertical-align:-3px;">content_copy</span>
            <span data-i18n="reportCopyText">텍스트 복사</span>
          </button>
          <button class="btn btn-secondary btn-sm" onclick="reportDownloadTxt()">
            <span class="material-icons" style="font-size:15px;vertical-align:-3px;">download</span>
            <span data-i18n="reportDownloadTxt">TXT 다운로드</span>
          </button>
        </div>
      </div>
      <div class="modal-body report-body" id="report-body"></div>
    </div>
  </div>

  <!-- Hidden file input for data restore -->
  <input type="file" id="restore-file-input" accept=".json" style="display:none;" onchange="handleRestore(event)">

  <!-- Backup Menu Modal -->
  <div id="backup-modal" class="modal-overlay" style="display:none;" onclick="closeBackupOutside(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="backupTitle">백업 / 복원</h2>
        <button class="icon-btn" onclick="closeBackupMenu()"><span class="material-icons">close</span></button>
      </div>
      <div class="modal-body backup-actions">
        <button class="btn btn-primary" onclick="triggerBackupDownload()" data-i18n="backupDownload">백업 다운로드 (JSON)</button>
        <button class="btn btn-secondary" onclick="restoreData()" data-i18n="backupUpload">백업 업로드 (JSON)</button>
      </div>
    </div>
  </div>

  <!-- App Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script src="js/modules/bag.js"></script>
  <script src="js/modules/time.js"></script>
  <script src="js/modules/brain.js"></script>
  <script src="js/modules/mind.js"></script>
  <script src="js/modules/color.js"></script>
  <script src="js/modules/music.js"></script>
  <script src="js/modules/word.js"></script>
  <script src="js/modules/relationship.js"></script>
  <script src="js/modules/money.js"></script>
  <script src="js/modules/app.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
